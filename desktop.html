/* ============ QUANTUMLEAP DESKTOP — style-guide tokens (verbatim) ============ */
:root {
  --bg: #ffffff;
  --panel: #ffffff;
  --border: #e3e6ea;
  --text: #1c2024;
  --muted: #6b7280;
  --accent: #013d5b;
  --accent-soft: #ebf4f5;
  --priority-high: #e5484d;
  --warn: #f59e0b;
  --neutral: #b2bfc6;
  --status: #38b16e;
  --active: #16a34a;
  --reading: #2563eb;
  --blocked: #dc2626;
  --done: #0ca35a;
  --library: #7c3aed;
  --stale: #977106;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 12px rgba(0,0,0,.05);
  /* aliases used by the ported QL renderer (md/dgHTML/dgSVG) */
  --card: #ffffff;
  --ink: #1c2024;
  --ink2: #6b7280;
  --ink3: #9aa1a9;
  --line: #e3e6ea;
  --line2: #e3e6ea;
  --accent-dim: #6b8296;
  --green: #16a34a;
  --amber: #f59e0b;
  --red: #e5484d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  font-size: 14px; line-height: 1.45; color: var(--text); background: var(--bg);
}
button { font-family: inherit; cursor: pointer; }
input, textarea, select { font-family: inherit; font-size: 13px; color: var(--text); }
a { color: var(--accent); }

/* ============ App shell ============ */
.app { display: grid; grid-template-columns: 260px 1fr; min-height: 100vh; }
.sidebar {
  background: #fafafa; border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; overflow-y: auto;
  display: flex; flex-direction: column; padding: 14px 10px 10px;
}
.main { background: var(--bg); padding: 20px 28px 40px; min-width: 0; }
.brand { display: flex; align-items: center; gap: 8px; padding: 2px 6px 12px; }
.brand img { width: 26px; height: 26px; border-radius: 7px; }
.brand b { font-size: 15px; letter-spacing: -0.01em; }
.brand span { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; margin-top: 2px; }
.sidesearch {
  display: flex; align-items: center; gap: 7px; margin: 0 2px 12px; padding: 6px 9px;
  border: 1px solid var(--border); border-radius: 8px; background: #fff; color: var(--muted);
  font-size: 12.5px; cursor: pointer; transition: border-color .12s;
}
.sidesearch:hover { border-color: #c7ccd3; }
.sidesearch kbd {
  margin-left: auto; font-family: inherit; font-size: 10.5px; color: var(--muted);
  border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; background: #fafafa;
}
.navsec { padding: 10px 6px 4px; font-size: 10.5px; font-weight: 700; color: var(--muted);
  text-transform: uppercase; letter-spacing: .06em; }
.nav-item {
  display: flex; align-items: center; gap: 8px; padding: 7px 9px; border-radius: 7px;
  font-size: 13px; color: var(--text); cursor: pointer; border: 0; background: transparent;
  width: 100%; text-align: left; transition: background .12s;
}
.nav-item:hover { background: #f1f3f5; }
.nav-item.active { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav-item .sw { width: 16px; height: 16px; border-radius: 5px; flex: 0 0 16px;
  display: inline-flex; align-items: center; justify-content: center; font-size: 10px; color: #fff; }
.nav-item .pnum { width: 16px; flex: 0 0 16px; font-size: 10.5px; color: #b8bec6; font-weight: 600; text-align: center; }
.navtheme { padding: 9px 9px 3px; font-size: 9.5px; font-weight: 700; color: #b8bec6;
  text-transform: uppercase; letter-spacing: .07em; display: flex; align-items: center; gap: 6px; }
.navtheme .tdot { width: 6px; height: 6px; border-radius: 2px; flex: 0 0 6px; opacity: .8; }
.nav-item .cnt { margin-left: auto; font-size: 11px; color: #a7adb6; }
.nav-item .cnt.badge { color: #fff; background: var(--accent); border-radius: 20px; padding: 1px 7px; font-size: 10.5px; font-weight: 600; }
.nav-item .pbar { margin-left: auto; width: 46px; height: 4px; border-radius: 3px; background: #ececf0; overflow: hidden; flex: 0 0 46px; }
.nav-item .pbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
.sidefoot { margin-top: auto; padding: 10px 4px 2px; border-top: 1px solid var(--border); }
.syncpill {
  display: flex; align-items: center; gap: 7px; padding: 6px 8px; border: 0; background: transparent;
  border-radius: 7px; font-size: 12px; color: var(--muted); width: 100%; text-align: left;
}
.syncpill:hover { background: #f1f3f5; }
.syncdot { width: 7px; height: 7px; border-radius: 50%; background: #b2bfc6; flex: 0 0 7px; }
.syncdot.ok { background: var(--status); }
.syncdot.busy { background: var(--warn); }
.syncdot.err { background: var(--blocked); }
.buildstamp { font-size: 10.5px; color: #c5c5cc; padding: 4px 8px 0; }

/* ============ Top bar / typography ============ */
.topbar { display: flex; align-items: center; gap: 8px; margin-bottom: 18px; flex-wrap: nowrap; }
.topbar .spacer { flex: 1; }
h1.pt { font-size: 18px; font-weight: 600; letter-spacing: -0.01em; }
.crumb { font-size: 12.5px; color: var(--muted); }
.crumb a { color: var(--muted); text-decoration: none; cursor: pointer; }
.crumb a:hover { color: var(--accent); }
.seclabel { font-size: 13px; font-weight: 700; margin: 22px 0 8px; display: flex; align-items: center; gap: 8px; }
.seclabel .cnt { font-weight: 400; font-size: 11.5px; color: #a7adb6; }
.micro { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }

/* ============ Buttons / chips ============ */
.btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 6px 11px; border-radius: 8px;
  border: 1px solid var(--border); background: var(--panel); font-size: 12.5px; font-weight: 500;
  color: var(--text); transition: background .12s, border-color .12s;
}
.btn:hover { border-color: #c7ccd3; background: #f8fafc; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: #031d4d; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--muted); }
.btn.ghost:hover { background: #eef0f3; color: var(--text); }
.btn.danger { color: var(--blocked); }
.btn:disabled { opacity: .45; cursor: default; }
.chip {
  display: inline-flex; align-items: center; gap: 5px; border-radius: 20px; border: 1px solid var(--border);
  background: #fff; padding: 3px 9px; font-size: 11.5px; color: var(--muted); transition: border-color .12s;
}
.chip:hover { border-color: #c7ccd3; }
.chip.on { background: var(--accent); border-color: var(--accent); color: #fff; }
.tagchip { background: #f1f1f3; color: var(--muted); font-size: 10.5px; border-radius: 20px; padding: 2px 8px; }
.dd { position: relative; display: inline-block; }
.ddtrig { border: 0; background: transparent; color: var(--muted); font-size: 12.5px; padding: 5px 8px; border-radius: 7px; }
.ddtrig:hover { background: #f1f3f5; }
.ddpop {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 60; background: #fff;
  border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); padding: 5px 0; min-width: 170px;
}
.ddpop button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 12px; font-size: 12.5px; }
.ddpop button:hover { background: #f1f3f5; }

/* ============ Cards / stats ============ */
.cardp { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 14px 16px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(128px, 1fr)); gap: 10px; margin-bottom: 6px; }
.kpi { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 12px 14px; }
.kpi .n { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; }
.kpi .n small { font-size: 12px; color: var(--muted); font-weight: 400; }
.kpi .l { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-top: 3px; }
.kpi .bar { height: 4px; border-radius: 3px; background: #ececf0; margin-top: 8px; overflow: hidden; }
.kpi .bar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }

/* ============ Rows (pillar table / topic rows) ============ */
.prow {
  display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 8px; cursor: pointer;
  transition: background .12s; border-left: 3px solid transparent;
}
.prow:hover { background: #f6f7f9; border-left-color: var(--accent); }
.prow .pn { width: 22px; font-size: 11px; color: #a7adb6; font-weight: 600; text-align: right; flex: 0 0 22px; }
.prow .pt2 { font-size: 13px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.prow .pmeta { font-size: 11px; color: #a7adb6; white-space: nowrap; }
.prow .pbar2 { width: 130px; height: 5px; border-radius: 3px; background: #ececf0; overflow: hidden; flex: 0 0 130px; }
.prow .pbar2 i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.mrow { display: flex; align-items: center; gap: 10px; padding: 6px 4px; border-radius: 7px; cursor: pointer; transition: background .12s; }
.mrow:hover { background: #f6f7f9; }
.mrow .pn { width: 18px; font-size: 10.5px; color: #b8bec6; font-weight: 600; text-align: right; flex: 0 0 18px; }
.mrow .pt2 { font-size: 12.5px; font-weight: 500; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mrow .pmeta { font-size: 10.5px; color: #a7adb6; white-space: nowrap; }
.mrow .pbar2 { width: 86px; height: 4px; border-radius: 3px; background: #ececf0; overflow: hidden; flex: 0 0 86px; }
.mrow .pbar2 i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
.trow {
  display: flex; align-items: center; gap: 9px; padding: 6px 8px 6px 10px; border-radius: 7px;
  cursor: pointer; border-left: 3px solid transparent; transition: background .12s;
}
.trow:hover { background: #f6f7f9; }
.trow.haslesson { cursor: pointer; background: #f2faf5; }
.trow.haslesson:hover { border-left-color: var(--done); background: #e8f6ee; }
.trow .tid { font-size: 10.5px; color: #c5c5cc; width: 34px; flex: 0 0 34px; font-weight: 600; }
.trow .tt { font-size: 12.5px; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.trow.nolesson .tt { color: var(--muted); }
.trow .lvl { font-size: 9.5px; color: #b8bec6; flex: 0 0 auto; width: 72px; text-align: right; }
.whyline { font-size: 11px; color: var(--muted); font-weight: 400; }
.topbar.sticky { position: sticky; top: 0; z-index: 30; background: var(--bg); padding: 14px 0 10px;
  margin: -20px 0 12px; border-bottom: 1px solid #f1f3f5; }
.trow .pri { font-size: 9.5px; font-weight: 700; border-radius: 4px; padding: 1px 5px; letter-spacing: .03em; flex: 0 0 auto; }
.pri.P0 { background: #fdecec; color: var(--priority-high); }
.pri.P1 { background: #fff8e7; color: var(--stale); }
.pri.P2 { background: #eef0f3; color: var(--muted); }
.lessonbadge {
  font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: #0a7a44;
  background: #dcf1e4; border-radius: 4px; padding: 1px 6px; flex: 0 0 auto;
}
.bigbarrow { display: flex; align-items: center; gap: 10px; margin: 10px 0 4px; }
.bigbar { flex: 1; height: 8px; border-radius: 4px; background: #eef0f3; overflow: hidden; }
.bigbar i { display: block; height: 100%; border-radius: 4px; background: var(--done); }
.bigbarrow span { font-size: 11px; color: var(--muted); white-space: nowrap; }
/* focus mode */
.app.focusmode { grid-template-columns: 1fr; }
.app.focusmode .sidebar { display: none; }
.focusbar { display: flex; align-items: center; gap: 10px; margin: -6px 0 14px; padding: 8px 12px;
  border: 1px solid var(--border); border-left: 3px solid var(--accent); border-radius: 9px;
  background: #fafbfc; font-size: 12px; color: var(--muted); }
.focusbar b { color: var(--text); font-weight: 600; }
.focusbar .fclock { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; }
.focuslessonbar { position: sticky; bottom: 14px; margin-top: 20px; display: flex; align-items: center;
  gap: 10px; background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 10px 14px;
  box-shadow: var(--shadow); }
.tickpop { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
  font-size: 90px; color: var(--done); pointer-events: none; z-index: 200;
  animation: tickpop .85s ease-out forwards; text-shadow: 0 4px 24px rgba(12,163,90,.25); }
@keyframes tickpop { 0%{opacity:0;transform:scale(.4)} 25%{opacity:1;transform:scale(1.12)}
  45%{transform:scale(1)} 70%{opacity:1} 100%{opacity:0;transform:scale(1.02)} }
@media (prefers-reduced-motion: reduce){ .tickpop{ display:none; } }
.mvtag { font-size: 9px; color: var(--stale); background: #fff8e7; border-radius: 4px; padding: 0 4px; }
.donetick { color: var(--done); font-size: 12px; flex: 0 0 14px; text-align: center; }
.trow .hoveract { opacity: 0; transition: opacity .12s; }
.trow:hover .hoveract { opacity: 1; }

/* ============ Study planner (week board) ============ */
.plhead { display: flex; align-items: center; gap: 8px; margin: 4px 0 10px; }
.plweek { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
.plday { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 8px; min-height: 150px;
  display: flex; flex-direction: column; gap: 6px; transition: border-color .12s, background .12s; }
.plday.today { border-color: var(--accent); box-shadow: inset 0 2px 0 0 var(--accent); }
.plday.past { background: #fcfcfc; }
.plday.dragover { background: var(--accent-soft); border-color: var(--accent); }
.pldh { display: flex; align-items: baseline; gap: 5px; padding: 0 2px; }
.pldh .dn { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.pldh .dd2 { font-size: 10.5px; color: #c5c5cc; }
.pldh .dload { margin-left: auto; font-size: 9.5px; color: #c5c5cc; }
.plday.today .pldh .dn { color: var(--accent); }
.plblock { border: 1px solid var(--border); border-radius: 8px; padding: 6px 8px; font-size: 11.5px;
  background: #fff; cursor: grab; position: relative; border-left-width: 3px; transition: border-color .12s; }
.plblock:hover { border-color: #c7ccd3; border-left-width: 3px; }
.plblock.done { opacity: .55; }
.plblock.done .plt { text-decoration: line-through; color: #9aa1a9; }
.plblock .plt { font-weight: 500; line-height: 1.3; display: block;
  overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.plblock .plm { font-size: 10px; color: #a7adb6; margin-top: 2px; display: flex; gap: 5px; align-items: center; }
.plblock .plx { position: absolute; top: 3px; right: 4px; opacity: 0; border: 0; background: transparent;
  color: var(--muted); font-size: 10px; cursor: pointer; transition: opacity .12s; }
.plblock:hover .plx { opacity: 1; }
.plblock .plck { cursor: pointer; }
.plrev { border-radius: 8px; padding: 5px 8px; font-size: 10.5px; color: var(--muted);
  background: #f6f7f9; border: 1px dashed var(--border); cursor: default; }
.plrev.has { color: var(--accent); background: var(--accent-soft); border-color: transparent; cursor: pointer; font-weight: 600; }
.pladd { border: 0; background: transparent; color: #c5c5cc; font-size: 11px; border-radius: 7px;
  padding: 4px; margin-top: auto; opacity: 0; transition: opacity .12s, background .12s; }
.plday:hover .pladd { opacity: 1; }
.pladd:hover { background: #f1f3f5; color: var(--muted); }
.goalbar { height: 5px; border-radius: 3px; background: #ececf0; overflow: hidden; flex: 1; min-width: 60px; max-width: 160px; }
.goalbar i { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
@media (max-width: 1180px) { .plweek { grid-template-columns: repeat(4, 1fr); } .plday:nth-child(n+5){min-height:110px} }

/* ============ Continue rail ============ */
.rail { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; }
.railcard { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 13px 15px; cursor: pointer; transition: border-color .12s; }
.railcard:hover { border-color: #c7ccd3; }
.railcard .re { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 6px; }
.railcard .rt { font-size: 13.5px; font-weight: 600; line-height: 1.35; }
.railcard .rm { font-size: 11.5px; color: var(--muted); margin-top: 5px; }
.railcard.acc { border-left: 3px solid var(--accent); }

/* ============ Lesson reader ============ */
.reader { display: grid; grid-template-columns: minmax(0, 1fr) 230px; gap: 28px; align-items: start; }
.readmain { min-width: 0; max-width: 880px; }
.readrail { position: sticky; top: 20px; font-size: 12px; }
.readrail .rlcard { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 12px 14px; margin-bottom: 10px; }
.toc a { display: block; padding: 4px 8px; border-radius: 6px; color: var(--muted); text-decoration: none; font-size: 11.5px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-left: 2px solid transparent; }
.toc a:hover { background: #f1f3f5; color: var(--text); }
.toc a.on { color: var(--accent); border-left-color: var(--accent); font-weight: 600; }
.metaline { display: flex; justify-content: space-between; gap: 8px; padding: 3px 0; font-size: 11.5px; color: var(--muted); }
.metaline b { color: var(--text); font-weight: 500; text-align: right; }
@media (max-width: 1080px) { .reader { grid-template-columns: 1fr; } .readrail { position: static; } }

/* ============ Review ============ */
.revwrap { max-width: 640px; margin: 0 auto; }
.revcard { background: #fff; border: 1px solid #ecf0f3; border-radius: 14px; padding: 26px 28px; box-shadow: var(--shadow); }
.revcard .q { font-size: 17px; font-weight: 600; line-height: 1.45; margin: 8px 0 4px; }
.revcard .a { margin-top: 14px; padding: 13px 15px; border-radius: 10px; background: #f6f7f9; border: 1px solid var(--border); font-size: 14px; line-height: 1.55; white-space: pre-wrap; }
.revcard .yours { margin-top: 12px; font-size: 12.5px; color: var(--muted); background: #fff; border: 1px dashed var(--border); border-radius: 8px; padding: 9px 12px; }
.choice { display: block; width: 100%; text-align: left; margin-top: 8px; padding: 10px 13px; border: 1px solid var(--border); border-radius: 9px; background: #fff; font-size: 13px; transition: border-color .12s, background .12s; }
.choice:hover { border-color: #c7ccd3; background: #f8fafc; }
.choice.correct { border-color: var(--done); background: #edfaf3; }
.choice.wrong { border-color: var(--blocked); background: #fdecec; }
.verdict { margin-top: 12px; border-radius: 9px; padding: 9px 13px; font-size: 13px; font-weight: 600; }
.verdict.ok { background: #edfaf3; color: #0a7a44; }
.verdict.no { background: #fdecec; color: #b02a2f; }
.graderow { display: flex; gap: 8px; margin-top: 16px; }
.gtile { flex: 1; border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 9px 6px 8px; text-align: center; transition: border-color .12s, background .12s; }
.gtile:hover { border-color: #c7ccd3; background: #f8fafc; }
.gtile .gl { display: block; font-size: 12px; font-weight: 600; }
.gtile .gi { display: block; font-size: 10.5px; color: var(--muted); margin-top: 2px; }
.gtile .gk { display: inline-block; font-size: 9.5px; color: var(--muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 4px; margin-bottom: 4px; background: #fafafa; }
.revtext { width: 100%; min-height: 96px; border: 1px solid var(--border); border-radius: 8px; padding: 9px 11px; margin-top: 12px; resize: vertical; }
.revtext:focus { outline: none; border-color: var(--accent); }
.kbdhint { text-align: center; font-size: 11px; color: #a7adb6; margin-top: 12px; }
.kbdhint kbd { font-family: inherit; border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; background: #fafafa; font-size: 10px; }

/* ============ Capture ============ */
.capgrid { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(230px, 1fr); gap: 20px; align-items: start; }
@media (max-width: 980px) { .capgrid { grid-template-columns: 1fr; } }
.field { margin-bottom: 14px; }
.field label { display: block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: 5px; }
.field input[type=text], .field textarea, .field select {
  width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; background: #fff;
}
.field input:focus, .field textarea:focus { outline: none; border-color: var(--accent); }
.field textarea { min-height: 110px; resize: vertical; }
.dropzone {
  border: 1.5px dashed #c7ccd3; border-radius: 10px; padding: 18px; text-align: center;
  color: var(--muted); font-size: 12.5px; transition: border-color .12s, background .12s; cursor: pointer;
}
.dropzone.over, .dropzone:hover { border-color: var(--accent); background: var(--accent-soft); }
.filerow { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px; font-size: 12.5px; }
.filerow:hover { background: #f6f7f9; }
.filerow .fx { margin-left: auto; opacity: 0; color: var(--muted); border: 0; background: transparent; }
.filerow:hover .fx { opacity: 1; }
.tahits { position: absolute; z-index: 70; left: 0; right: 0; top: calc(100% + 3px); background: #fff; border: 1px solid var(--border); border-radius: 10px; box-shadow: var(--shadow); max-height: 260px; overflow-y: auto; padding: 4px 0; }
.tahits button { display: block; width: 100%; text-align: left; border: 0; background: transparent; padding: 7px 11px; font-size: 12.5px; }
.tahits button:hover, .tahits button.sel { background: #f1f3f5; }
.caprow { display: flex; align-items: center; gap: 8px; padding: 6px 4px; font-size: 12px; color: var(--muted); border-top: 1px solid #f1f3f5; }
.caprow:first-child { border-top: 0; }

/* ============ Search overlay ============ */
.sov { position: fixed; inset: 0; background: rgba(15,18,22,.4); z-index: 100; display: none; align-items: flex-start; justify-content: center; padding-top: 9vh; }
.sov.open { display: flex; }
.sbox { width: 620px; max-width: 92vw; background: #fff; border-radius: 14px; box-shadow: 0 8px 40px rgba(0,0,0,.18); overflow: hidden; }
.sbox input { width: 100%; border: 0; padding: 15px 18px; font-size: 15px; border-bottom: 1px solid var(--border); }
.sbox input:focus { outline: none; }
.shits { max-height: 54vh; overflow-y: auto; padding: 6px; }
.sgroup { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); padding: 8px 10px 3px; }
.shit { display: flex; align-items: center; gap: 9px; width: 100%; text-align: left; border: 0; background: transparent; padding: 8px 10px; border-radius: 8px; font-size: 13px; }
.shit:hover, .shit.sel { background: #f1f3f5; }
.shit .sm { margin-left: auto; font-size: 10.5px; color: #a7adb6; white-space: nowrap; }

/* ============ Modal / toast / empty ============ */
.mov { position: fixed; inset: 0; background: rgba(15,18,22,.4); z-index: 90; display: none; align-items: center; justify-content: center; }
.mov.open { display: flex; }
.mbox { background: #fff; border-radius: 14px; padding: 22px 24px; max-width: 520px; width: 92vw; box-shadow: 0 8px 40px rgba(0,0,0,.18); max-height: 86vh; overflow-y: auto; }
.mbox h3 { font-size: 16px; margin-bottom: 12px; }
.mactions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 18px; }
.mactions .left { margin-right: auto; }
.toast {
  position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(80px); z-index: 120;
  background: var(--text); color: #fff; border-radius: 9px; padding: 9px 16px; font-size: 12.5px;
  opacity: 0; transition: transform .18s, opacity .18s; pointer-events: none; max-width: 80vw;
}
.toast.show { transform: translateX(-50%); opacity: 1; }
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .glyph { font-size: 30px; margin-bottom: 10px; color: #c7ccd3; }
.empty h3 { color: var(--text); font-size: 16px; margin-bottom: 6px; }

/* ============ Ported QL renderer support (md / dgHTML / dgSVG / lesson blocks) ============ */
.card.lux { background: #fff; border: 1px solid #ecf0f3; border-radius: 12px; padding: 14px 16px; margin: 12px 0; }
.eyebrow { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.legacy h4 { font-size: 15px; font-weight: 600; margin: 18px 0 6px; }
.legacy p { margin: 8px 0; font-size: 13.5px; line-height: 1.6; }
.legacy ul { margin: 8px 0 8px 20px; font-size: 13.5px; line-height: 1.6; }
.legacy blockquote { border-left: 3px solid var(--accent); background: var(--accent-soft); border-radius: 0 8px 8px 0; padding: 9px 13px; margin: 10px 0; font-size: 13px; }
.vshead { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px; margin-bottom: 6px; }
.vshead span { font-size: 11px; font-weight: 700; text-align: center; padding: 3px 4px; border-bottom: 2px solid transparent; }
.vsrow { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 6px; margin-top: 5px; }

<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main"></main>

<script>
/* ===================== QUANTUMLEAP DESKTOP ===================== */
/* Companion surface to the QuantumLeap mobile PWA (index.html).
   Reads/writes the SAME private-vault files (app-data.json / app-state.json).
   State code (defaultDB/mergeDB/FSRS/units) is ported VERBATIM from index.html —
   any state-key added to mobile mergeDB MUST be mirrored here (harness-checked). */
"use strict";
const BUILD="desk-v3";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DAY=86400000;
const clamp=(x,lo,hi)=>Math.min(hi,Math.max(lo,x));
const todayStr=(d=new Date())=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const LANES=[["filter","Skim","Triage in ≤10 min"],["understand","Understand","Build the mental model"],["master","Master","Critique, connect, apply"]];
const LANE_LEGACY={retrieve:"filter",gist:"filter",learn:"master",evaluate:"master",filter:"filter",understand:"understand",master:"master"};
const laneName=id=>(LANES.find(l=>l[0]===id)||["","?"])[1];

/* ---------- content (from private repo; desktop always fetches fresh, no big-blob cache) ---------- */
let DATA={v:3,categories:[],items:[],glossary:[],quotes:[],challenges:[]};
let DATALOADED=false;

/* ---------- state (own cache key — never touches the mobile PWA's meridian.db) ---------- */
function defaultDB(){return {v:3,updatedAt:0,srs:{},done:{},notes:[],projects:[],custom:[],itemState:{},inboxDecisions:{},newsActions:{},glossRead:{},goals:[],planProg:{},planCustom:{},userColls:[],favs:{},lastSeen:0,caps:[],meetTasks:{},trackOrder:[],glossFavs:{},todos:{},todoOrder:[],
  meta:{streak:0,lastDay:"",xp:0,revlog:{},intake:{},gradelog:{},minlog:{},catlog:{}}};}
let DB=defaultDB();
try{const raw=localStorage.getItem("meridian.desk.db");if(raw)DB=Object.assign(defaultDB(),JSON.parse(raw));
  DB.meta=Object.assign(defaultDB().meta,DB.meta||{});}catch(e){}
let VIEW={name:"home",p:null}, syncState="off", syncTimer=null, stateSha=null;

function saveLocal(){DB.updatedAt=Date.now();localStorage.setItem("meridian.desk.db",JSON.stringify(DB));queueSync();}
function token(){return localStorage.getItem("meridian.token")||"";}
function repo(){return localStorage.getItem("meridian.repo")||"";}

/* ---------- effective items (data + user overlay) — verbatim ---------- */
function itemState(id){return DB.itemState[id]||{};}
function items(){return DATA.items.map(it=>{
  const st=itemState(it.id);
  return Object.assign({},it,{lane:LANE_LEGACY[st.lane||it.lane]||"filter",cats:st.cats||it.cats,edits:st.edits||{},history:(it.history||[]).concat(st.history||[])});
});}
function item(id){return items().find(x=>x.id===id);}
function catOf(id){return DATA.categories.find(c=>c.id===id)||{id,name:id,glyph:"·"};}
function artifact(it,key){return (it.edits&&it.edits[key])||(it.artifacts&&it.artifacts[key]);}

/* ---------- review units — verbatim ---------- */
function allUnits(){
  const out=[];
  for(const it of items()){
    if(it.lane!=="master")continue;
    const push=(arr,type,pref)=>((arr||[]).forEach((a,i)=>out.push({id:it.id+"#"+pref+i,type,a,item:it,cat:(it.cats||[])[0]||"misc"})));
    push(artifact(it,"cards"),"card","c");
    push(artifact(it,"quiz"),"mcq","q");
    push(artifact(it,"prompts"),"prompt","p");
    push(artifact(it,"drills"),"drill","d");
  }
  (DB.custom||[]).forEach(c=>{if(!c.del)out.push({id:c.id,type:"card",a:{q:c.q,a:c.a},item:null,cat:c.track||"note",src:c.src||"Your note"});});
  return out;
}
function unlockedUnits(){
  return allUnits().filter(u=>{
    if(!u.item)return true;
    if(artifact(u.item,"lesson"))return !!DB.done[u.item.id];
    return true;
  });
}
function dueUnits(){const now=Date.now();return unlockedUnits().filter(u=>DB.srs[u.id]&&!DB.srs[u.id].susp&&DB.srs[u.id].due<=now);}
function newUnits(){return unlockedUnits().filter(u=>!DB.srs[u.id]);}
function newAllowance(){const t=todayStr();const used=(DB.meta.intake&&DB.meta.intake[t])||0;return Math.max(0,8-used);}
function reviewBadgeCount(){return dueUnits().length+Math.min(newUnits().length,newAllowance());}
function interleave(arr){
  const by={};arr.forEach(u=>{(by[u.cat]=by[u.cat]||[]).push(u);});
  const keys=Object.keys(by);const out=[];let more=true;
  while(more){more=false;for(const k of keys){const u=by[k].shift();if(u){out.push(u);more=true;}}}
  return out;
}
function resolveUnit(u){
  if(!u.item)return u;
  const it=item(u.item.id);if(!it)return u;
  const m=u.id.match(/#([cqpd])(\d+)$/);if(!m)return u;
  const key={c:"cards",q:"quiz",p:"prompts",d:"drills"}[m[1]];
  const arr=artifact(it,key)||[];
  return Object.assign({},u,{a:arr[+m[2]]||u.a,item:it});
}

/* ---------- FSRS-4.5 — verbatim ---------- */
const FW=[0.4872,1.4003,3.7145,13.8206,5.1618,1.2298,0.8975,0.031,1.6474,0.1367,1.0461,2.1072,0.0793,0.3246,1.587,0.2272,2.8755];
const F_FACTOR=19/81, F_DECAY=-0.5;
function fsR(days,s){return Math.pow(1+F_FACTOR*Math.max(0,days)/s,F_DECAY);}
function fsS0(G){return Math.max(0.1,FW[G-1]);}
function fsD0(G){return clamp(FW[4]-Math.exp(FW[5]*(G-1))+1,1,10);}
function fsNext(e,G,elapsed){
  const r=fsR(elapsed,e.s);
  let d=e.d-FW[6]*(G-3);
  d=clamp(FW[7]*fsD0(4)+(1-FW[7])*d,1,10);
  let s;
  if(G===1){
    s=FW[11]*Math.pow(e.d,-FW[12])*(Math.pow(e.s+1,FW[13])-1)*Math.exp(FW[14]*(1-r));
    s=Math.min(s,e.s);
  }else{
    const hard=G===2?FW[15]:1, easy=G===4?FW[16]:1;
    s=e.s*(Math.exp(FW[8])*(11-e.d)*Math.pow(e.s,-FW[9])*(Math.exp(FW[10]*(1-r))-1)*hard*easy+1);
  }
  return {d:d,s:clamp(s,0.1,36500)};
}
function fsInterval(s){return clamp(Math.round(s),1,365);}
function migrateSRS(){
  let n=0;
  for(const k in DB.srs){const e=DB.srs[k];
    if(e&&e.s==null){
      e.s=Math.max(0.5,e.iv||0.5);
      e.d=clamp(6.4-((e.ease||2.5)-2.5)*3.2,1,10);
      e.lapses=e.lapses||0;e.last=e.u||Date.now();
      delete e.iv;delete e.ease;n++;
    }}
  return n;
}
migrateSRS();
function grade(unit,g){
  const now=Date.now(), G=g+1, id=unit.id;
  let e=DB.srs[id];
  if(!e){
    const t=todayStr();DB.meta.intake=DB.meta.intake||{};DB.meta.intake[t]=(DB.meta.intake[t]||0)+1;
    e={s:fsS0(G),d:fsD0(G),reps:0,lapses:0,last:now};
  }else{
    const nx=fsNext(e,G,Math.max(0,(now-(e.last||now))/DAY));
    e.s=nx.s;e.d=nx.d;
  }
  if(g===0){e.lapses=(e.lapses||0)+1;e.due=now+600000;}
  else{e.due=now+fsInterval(e.s)*DAY;}
  e.reps=(e.reps||0)+1;e.last=now;e.u=now;DB.srs[id]=e;
  const t=todayStr();
  DB.meta.revlog[t]=(DB.meta.revlog[t]||0)+1;
  const gl=DB.meta.gradelog[t]||{n:0,a:0};gl.n++;if(g===0)gl.a++;DB.meta.gradelog[t]=gl;
  const cat=unit.cat||"misc";
  const cl=DB.meta.catlog[cat]||{n:0,a:0};cl.n++;if(g===0)cl.a++;DB.meta.catlog[cat]=cl;
  DB.meta.xp+=2;bumpStreak();saveLocal();
}
function ivPreview(id,g){
  const G=g+1,e=DB.srs[id];
  if(!e)return fsInterval(fsS0(G))+" d";
  return fsInterval(fsNext(e,G,Math.max(0,(Date.now()-(e.last||Date.now()))/DAY)).s)+" d";
}
/* streak shield: one missed day forgiven per week (ADHD-friendly — a bad day must not zero
   the streak). Shield state lives in planCustom["ql-flags"] (merge-safe in both apps).
   KEEP wkKey+bumpStreak BYTE-IDENTICAL with index.html — harness-enforced. */
function wkKey(){const d=new Date();d.setHours(0,0,0,0);const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return todayStr(d);}
function bumpStreak(){
  const t=todayStr(),y=todayStr(new Date(Date.now()-DAY)),y2=todayStr(new Date(Date.now()-2*DAY));
  if(DB.meta.lastDay===t)return;
  if(DB.meta.lastDay===y){DB.meta.streak=(DB.meta.streak||0)+1;}
  else if(DB.meta.lastDay===y2){
    DB.planCustom=DB.planCustom||{};
    const f=DB.planCustom["ql-flags"]||{v:1,u:0};
    if(f.shieldWeek!==wkKey()){
      f.shieldWeek=wkKey();f.u=Date.now();DB.planCustom["ql-flags"]=f;
      DB.meta.streak=(DB.meta.streak||0)+1;
      try{toast("🛡 Streak shield used — yesterday is forgiven");}catch(e){}
    }else{DB.meta.streak=1;}
  }
  else{DB.meta.streak=1;}
  DB.meta.lastDay=t;
}

/* ---------- GitHub repo sync — verbatim (desk cache keys) ---------- */
async function gh(path,opt={},raw){
  opt.headers=Object.assign({Authorization:"Bearer "+token(),
    Accept:raw?"application/vnd.github.raw+json":"application/vnd.github+json"},opt.headers||{});
  const r=await fetch("https://api.github.com"+path,opt);

function md(body,dgs){
  const fmt=s=>esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>")
    .replace(/!\[([^\]]*)\]\((https?:[^)\s]+|data:image\/[^)\s]+)\)/g,'<img src="$2" alt="$1" loading="lazy" style="max-width:100%;border-radius:12px;border:1px solid var(--line2);margin:6px 0">')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" style="color:var(--accent)">$1</a>');
  return String(body||"").trim().split(/\n\n+/).map(p=>{
    p=p.trim();
    const dm=p.match(/^\{\{DIAGRAM:(\d+)\}\}$/);
    if(dm){
      const dg=dgs&&dgs[+dm[1]];
      if(!dg)return "";
      if(dg.t==="vs"||dg.t==="steps"||dg.t==="list")return dgHTML(dg);
      return `<div class="card lux dg-inline"><div class="eyebrow">${esc(dg.cap||"How it flows")}</div>${dgSVG(dg)}</div>`;
    }
    if(p.startsWith("## ")){
      const lines=p.split("\n");const hd=lines.shift();
      let out="<h4>"+esc(hd.slice(3))+"</h4>";
      if(lines.length)out+="<p>"+fmt(lines.join(" "))+"</p>";
      return out;
    }
    if(p.startsWith("- ")){
      const its=p.split("\n").filter(l=>l.trim().startsWith("- ")).map(l=>l.trim().slice(2));
      return "<ul>"+its.map(x=>"<li>"+fmt(x)+"</li>").join("")+"</ul>";
    }
    if(p.startsWith("> ")){
      const lines=p.split("\n").map(l=>l.replace(/^>\s?/,""));
      return "<blockquote>"+fmt(lines.join(" "))+"</blockquote>";
    }
    return "<p>"+fmt(p.replace(/\n/g," "))+"</p>";
  }).join("");
}
function dgWrap(s,max){

function dgSVG(dg){
  const W=330, bh=48, gap=24;

  if(dg.t==="cycle"){
    H=dg.s.length*(bh+gap)-gap+8;
    dg.s.forEach((s,i)=>{
      const y=4+i*(bh+gap);
      inner+=dgBox(46,y,W-92,bh,s,i===0);
      if(i<dg.s.length-1)inner+=dgArrow(W/2,y+bh,W/2,y+bh+gap-2);
    });

    inner+=`<path d="M ${W-46} ${y1} C ${W-8} ${y1}, ${W-8} ${y0}, ${W-44} ${y0}" fill="none" style="stroke:var(--accent-dim)" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#dgA)"/>`;
  }else if(dg.t==="split"){
    const bar=dg.s.indexOf("|");
    const left=dg.s.slice(1,bar), right=dg.s.slice(bar+1);
    const rows=Math.max(left.length,right.length);
    H=(bh+gap)+rows*(bh+gap)-gap+8;
    inner+=dgBox(70,4,W-140,bh,dg.s[0],true);
    const bw=(W-40)/2-10;
    inner+=dgArrow(W/2-20,4+bh,20+bw/2,4+bh+gap-2);
    inner+=dgArrow(W/2+20,4+bh,W-20-bw/2,4+bh+gap-2);
    left.forEach((s,i)=>{const y=4+(bh+gap)*(i+1);inner+=dgBox(20,y,bw,bh,s,false);
      if(i<left.length-1)inner+=dgArrow(20+bw/2,y+bh,20+bw/2,y+bh+gap-2);});
    right.forEach((s,i)=>{const y=4+(bh+gap)*(i+1);inner+=dgBox(W-20-bw,y,bw,bh,s,false);
      if(i<right.length-1)inner+=dgArrow(W-20-bw/2,y+bh,W-20-bw/2,y+bh+gap-2);});
  }else{
    H=dg.s.length*(bh+gap)-gap+8;
    dg.s.forEach((s,i)=>{
      const y=4+i*(bh+gap);
      inner+=dgBox(30,y,W-60,bh,s,i===0||i===dg.s.length-1);
      if(i<dg.s.length-1)inner+=dgArrow(W/2,y+bh,W/2,y+bh+gap-2);
    });
  }
  return `<svg viewBox="0 0 ${W} ${H+4}" style="width:100%;height:auto;display:block;margin-top:10px" xmlns="http://www.w3.org/2000/svg">${defs}${inner}</svg>`;
}

/* ---------- study scheduler (week planner) ----------

const SCHED_KEY="desk-sched";

function schedGet(){
  const s=(DB.planCustom||{})[SCHED_KEY];
  return s&&s.items?{v:1,items:s.items||[],goal:Object.assign({lessonsWk:5},s.goal||{}),u:s.u||0}:{v:1,items:[],goal:{lessonsWk:5},u:0};

function weekStart(off){
  const d=new Date();d.setHours(0,0,0,0);
  const dow=(d.getDay()+6)%7; /* Monday=0 */
  d.setDate(d.getDate()-dow+(off||0)*7);

}
function addDays(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x;}
function lessonMin(it){const l=it&&it.artifacts&&it.artifacts.lesson;return (l&&l.min)||15;}

function reviewForecast(dayK,isToday,isPast){
  if(isPast)return (DB.meta.revlog||{})[dayK]||0;
  if(isToday)return dueUnits().length+Math.min(newUnits().length,newAllowance());
  let n=0;const t0=Date.parse(dayK+"T00:00:00"),t1=t0+DAY;
  for(const u of unlockedUnits()){const e=DB.srs[u.id];if(e&&!e.susp&&e.due>=t0&&e.due<t1)n++;}

}
function weekSched(s,ws){
  const keys=[];for(let i=0;i<7;i++)keys.push(todayStr(addDays(ws,i)));
  const by={};keys.forEach(k=>by[k]=[]);
  (s.items||[]).forEach(it=>{if(by[it.day])by[it.day].push(it);});
  keys.forEach(k=>by[k].sort((a,b)=>(a.u||0)-(b.u||0)));
  return {keys,by};
}
function interleaveLessons(cands){
  const by={};cands.forEach(x=>{(by[x.p.id]=by[x.p.id]||[]).push(x);});
  const ks=Object.keys(by),out=[];let more=true;
  while(more){more=false;for(const k of ks){const x=by[k].shift();if(x){out.push(x);more=true;}}}
  return out;

function autoPlanWeek(){
  const s=schedGet();
  const ws=weekStart(WEEKOFF);
  const today=todayStr();
  const {keys,by}=weekSched(s,ws);
  const openDays=keys.filter(k=>k>=today);
  if(!openDays.length)return {added:0,note:"This week is in the past — jump to the current week."};
  const goal=s.goal.lessonsWk||5;
  const lessonsThisWeek=keys.reduce((n,k)=>n+by[k].filter(i=>i.type==="lesson").length,0);
  let need=Math.max(0,goal-lessonsThisWeek);
  if(!need)return {added:0,note:"Weekly goal already scheduled — raise the goal to plan more."};
  const scheduledRefs=new Set((s.items||[]).filter(i=>i.type==="lesson").map(i=>i.ref));
  const cands=interleaveLessons(nextLessons(need+12).filter(x=>!scheduledRefs.has(x.t.id))).slice(0,need);
  /* Todait-style workload balancing: place each lesson on the open day with the lightest
     load (review forecast minutes + already-planned minutes), max 2 lessons/day */
  const load={};openDays.forEach(k=>{
    const isT=k===today;
    load[k]=reviewForecast(k,isT,false)*0.5+by[k].reduce((m,i)=>m+(i.min||15),0);
  });
  let added=0;
  cands.forEach((x,ci)=>{
    const day=openDays.filter(k=>by[k].filter(i=>i.type==="lesson").length<2)
      .sort((a,b)=>load[a]-load[b])[0];
    if(!day)return;
    const it=item(x.t.id);
    const block={id:"s"+Date.now()+"-"+ci,day,type:"lesson",ref:x.t.id,title:x.t.t,min:lessonMin(it),u:Date.now()+ci};
    s.items.push(block);by[day].push(block);load[day]+=block.min;added++;
  });

/* rollover without shame: unfinished past blocks quietly move to today (↻ tag, no guilt pile) */
function rolloverSched(){
  const s=schedGet(),t=todayStr();let ch=false;
  (s.items||[]).forEach(x=>{
    if(x.day<t){
      const isDone=x.type==="lesson"?!!DB.done[x.ref]:!!x.done;
      if(!isDone){if(!x.mv)x.mv=x.day;x.day=t;x.u=Date.now();ch=true;}
    }});
  if(ch)schedSave(s);
  return ch;
}

let FOCUS=null,FCLOCK=null;
function focusLessons(){
  const s=schedGet(),t=todayStr();
  return (s.items||[]).filter(x=>x.day===t&&x.type==="lesson"&&x.ref&&!DB.done[x.ref]&&item(x.ref)).map(x=>x.ref);
}
function focusEstMin(){
  const due=dueUnits().length, fresh=Math.min(newUnits().length,newAllowance());
  const l=focusLessons().reduce((a,r)=>a+lessonMin(item(r)),0);
  return Math.round((due+fresh)*0.5+l);
}
function startFClock(){
  clearInterval(FCLOCK);
  FCLOCK=setInterval(()=>{
    const el=document.querySelector(".fclock");
    if(!el||!FOCUS)return;
    const s=Math.floor((Date.now()-FOCUS.t0)/1000);
    el.textContent=Math.floor(s/60)+":"+String(s%60).padStart(2,"0");
  },1000);
}
function focusBar(){
  if(!FOCUS)return "";
  const stage=FOCUS.stage==="review"?(FOCUS.mode==="quick"?"5-minute recall":"Recall"):FOCUS.stage==="lessons"?`Lesson ${FOCUS.li+1} of ${FOCUS.lessons.length}`:"Done";
  return `<div class="focusbar"><b>◉ Focus</b><span>${esc(stage)}</span><span class="fclock">0:00</span>
    <span style="flex:1"></span><button class="btn ghost" onclick="APP.focusExit()">✕ Exit <kbd style="font-size:9px;border:1px solid var(--border);border-radius:4px;padding:0 4px;background:#fafafa">Esc</kbd></button></div>`;
}
function showTick(txt){
  const d=document.createElement("div");d.className="tickpop";d.textContent=txt||"✓";
  document.body.appendChild(d);setTimeout(()=>{try{d.remove();}catch(e){}},900);
}
function logMin(m){const t=todayStr();DB.meta.minlog[t]=Math.round(((DB.meta.minlog[t]||0)+m)*10)/10;}
function activeMinToday(){return (DB.meta.minlog||{})[todayStr()]||0;}
function retention30(){
  let n=0,a=0;
  for(let i=0;i<30;i++){const k=todayStr(new Date(Date.now()-i*DAY));const e=(DB.meta.gradelog||{})[k];if(e){n+=e.n;a+=e.a;}}
  return n?Math.round((1-a/n)*100):null;
}

function heatmapHTML(){

  for(let d=0;d<7;d++){
    cells+=`<div style="display:flex;gap:3px">`;

      const day=addDays(start,wk*7+d);

      const fut=k>today;

      const col=n===0?"#f1f3f5":n<3?"#DEF2E6":n<6?"#9DD8B3":n<10?"#61C084":"#16A34A";
      cells+=`<span title="${k} · ${n} recalled" style="width:11px;height:11px;border-radius:3px;background:${fut?"transparent":col};${fut?"border:1px dashed #eef0f3;":""}${k===today?"box-shadow:0 0 0 1.5px var(--accent);":""}"></span>`;
    }

  }
  return `<div style="display:flex;flex-direction:column;gap:3px">${cells}</div>`;
}
function weakSpots(n){

let SESSION=null;
function gradeRowD(u){
  const T=[["Again","10 min","1"],["Hard",ivPreview(u.id,1),"2"],["Good",ivPreview(u.id,2),"3"],["Easy",ivPreview(u.id,3),"4"]];
  const C=["var(--blocked)","var(--warn)","var(--status)","var(--done)"];
  return `<div class="graderow">`+T.map(([l,iv,k],g)=>
    `<button class="gtile" onclick="APP.grade(${g})"><span class="gk">${k}</span><span class="gl" style="color:${C[g]}">${l}</span><span class="gi">${iv}</span></button>`).join("")+`</div>`;
}
function buildSession(){
  const due=interleave(dueUnits());
  const pool=newUnits(), allow=newAllowance();
  const byType={card:[],mcq:[],prompt:[],drill:[]};
  pool.forEach(u=>{(byType[u.type]=byType[u.type]||[]).push(u);});
  const fresh=[];const cycle=["card","mcq","card","prompt","card","mcq","drill"];let ci=0;
  while(fresh.length<Math.min(allow,pool.length)){
    const t=cycle[ci%cycle.length];ci++;
    const u=(byType[t]&&byType[t].shift())||pool.find(x=>!fresh.includes(x));
    if(u&&!fresh.includes(u))fresh.push(u);
    if(ci>allow*4)break;
  }
  return [...due,...fresh];
}
function vReview(){
  if(!SESSION){
    const q=buildSession();
    if(!q.length){
      const locked=allUnits().length-unlockedUnits().length;
      return topbar("Review")+`<div class="empty"><div class="glyph">◈</div><h3>All clear</h3>

      <div style="margin-top:16px"><button class="btn" onclick="APP.go('home')">Back to overview</button></div></div>`;
    }
    SESSION={q,i:0,shown:false,doneCount:0,typed:"",picked:null,missed:null};
  }
  const s=SESSION;
  if(s.i>=s.q.length){
    const n=s.doneCount;SESSION=null;
    const tk=todayStr(); const gl=(DB.meta.gradelog||{})[tk]||{n:0,a:0};
    const todayRet=gl.n?Math.round((1-gl.a/gl.n)*100):null;
    const ret30=retention30();
    return topbar("Session complete")+`<div class="empty"><div class="glyph">✦</div><h3>Session complete</h3>
      <div class="kpis" style="max-width:420px;margin:16px auto 8px">

      <div style="margin-top:14px"><button class="btn primary" onclick="APP.go('home')">Back to overview</button></div></div>`;
  }
  const u=resolveUnit(s.q[s.i]);
  const src=u.item?catOf(u.cat).name:(u.src||"Your note");
  const typeLbl=u.type==="card"?"recall":u.type==="mcq"?"quiz":u.type==="prompt"?"short answer":"scenario";
  let inner=`<div class="eyebrow">${esc(src)} · ${typeLbl}</div>`;
  let controls="", hint="";
  if(u.type==="mcq"){
    const a=u.a;
    inner+=`<div class="q">${esc(a.q)}</div>`;
    if(!s.shown){
      controls=a.choices.map((c,i)=>`<button class="choice" onclick="APP.pick(${i})"><b style="color:var(--muted);margin-right:6px">${String.fromCharCode(65+i)}</b>${esc(c)}</button>`).join("");
      hint=`<kbd>A</kbd>–<kbd>${String.fromCharCode(64+a.choices.length)}</kbd> pick an answer`;
    }else{
      const right=s.picked===a.correct, letter=String.fromCharCode(65+a.correct);
      controls=`<div class="verdict ${right?"ok":"no"}">${right?"✓ Correct":"✗ Not quite — "+letter+" is right"}</div>`+
        a.choices.map((c,i)=>{const cls=i===a.correct?"correct":(i===s.picked?"wrong":"");
          return `<button class="choice ${cls}"><b style="color:var(--muted);margin-right:6px">${String.fromCharCode(65+i)}</b>${esc(c)}${i===a.correct?" ✓":""}</button>`;}).join("")+
        (a.why?`<div class="keybox" style="margin-top:10px">💡 ${esc(a.why)}</div>`:"")+gradeRowD(u);
      hint=`<kbd>1</kbd>–<kbd>4</kbd> grade yourself`;
    }
  }else if(u.type==="prompt"||u.type==="drill"){
    const a=u.a;
    inner+=`<div class="q">${esc(a.q||a.scenario)}</div>`;
    if(s.shown){
      if(s.typed)inner+=`<div class="yours"><strong>Your answer:</strong> ${esc(s.typed)}</div>`;
      inner+=`<div class="a">${esc(a.model||a.a)}</div>`;
      controls=gradeRowD(u);
      hint=`<kbd>1</kbd>–<kbd>4</kbd> grade yourself`;
    }else{
      controls=`<textarea id="typedIn" class="revtext" placeholder="${u.type==="drill"?"How would you handle it? Then compare (⌘↵)":"Type what you remember, then compare (⌘↵)"}">${esc(s.typed||"")}</textarea>
      <button class="btn primary" style="width:100%;margin-top:10px;justify-content:center" onclick="APP.checkTyped()">Compare with model answer</button>`;
      hint=`<kbd>⌘↵</kbd> compare`;
    }
  }else{
    inner+=`<div class="q">${esc(u.a.q)}</div>`;
    if(s.shown){
      inner+=`<div class="a">${esc(u.a.a)}</div>`;
      controls=gradeRowD(u);
      hint=`<kbd>1</kbd>–<kbd>4</kbd> grade yourself`;
    }else{
      controls=`<button class="btn primary" style="width:100%;margin-top:14px;justify-content:center" onclick="APP.reveal()">Show answer</button>`;
      hint=`<kbd>Space</kbd> show answer`;
    }
  }
  let missBox="";
  if(s.missed&&s.missed.item){
    const les=artifact(s.missed.item,"lesson");
    missBox=`<div class="cardp" style="border-left:3px solid var(--blocked);margin-top:14px"><div class="micro" style="color:var(--blocked);margin-bottom:4px">Missed — re-anchor before it returns</div>

    <button class="btn ghost" onclick="APP.go('lesson','${s.missed.item.id}')">Open lesson →</button></div>`;
  }
  return topbar("Review",null,`<span class="chip">${s.i+1} of ${s.q.length}</span><button class="btn ghost" onclick="APP.endSession()">End session</button>`)+
    `<div class="revwrap"><div class="revcard">${inner}${controls}</div><div class="kbdhint">${hint}</div>${missBox}</div>`;
}

let CAP={note:"",url:"",instr:"",lane:"filter",work:false,mode:"fast",files:[],topic:null};
function suggestPillar(){
  const text=(CAP.note+" "+CAP.url+" "+(CAP.files.map(f=>f.name).join(" "))).toLowerCase();
  const words=text.split(/[^a-z0-9]+/).filter(w=>w.length>3);
  if(!words.length)return null;
  let best=null,bestScore=0;
  pillars().forEach(p=>{
    let score=0;
    (p.subs||[]).forEach(sb=>(sb.topics||[]).forEach(t=>{
      const tt=t.t.toLowerCase();
      words.forEach(w=>{if(tt.includes(w))score++;});
    }));
    if(score>bestScore){bestScore=score;best=p;}
  });
  return bestScore>=2?best:null;
}

let SOPEN=false,SSEL=0,SHITS=[];
function searchHits(q){
  q=q.trim().toLowerCase();
  if(q.length<2)return [];
  const out=[];
  const ix=topicIndex(), wr=writtenSet();
  const score=t=>t.toLowerCase().indexOf(q)===0?2:1;
  Object.values(ix).forEach(({topic,pillar})=>{
    if(topic.t.toLowerCase().includes(q)||topic.id.toLowerCase()===q){
      const w=wr.has(topic.id)||topic.note;
      out.push({g:"Topics",l:topic.t,m:topic.id+" · "+pillar.title+(w?" · lesson":""),s:score(topic.t)+(w?0.5:0),
        go:w?()=>APP.go("lesson",topic.id):()=>APP.go("pillar",pillar.id)});
    }});
  items().forEach(it=>{
    if(it.curriculum)return;
    if((it.title||"").toLowerCase().includes(q))out.push({g:"Library",l:it.title,m:laneName(it.lane),s:score(it.title),go:()=>APP.go("item",it.id)});
  });
  (DATA.glossary||[]).forEach(g=>{
    if((g.term||"").toLowerCase().includes(q))out.push({g:"Glossary",l:g.term,m:g.cat||"",s:score(g.term),go:()=>APP.gloss(g.id)});
  });
  pillars().forEach(p=>{
    if(p.title.toLowerCase().includes(q))out.push({g:"Pillars",l:p.n+". "+p.title,m:"pillar",s:score(p.title)+1,go:()=>APP.go("pillar",p.id)});
  });
  out.sort((a,b)=>b.s-a.s);
  return out.slice(0,24);
}

    ${picks.map(x=>`<button class="shit" style="width:100%" onclick="APP.schedAdd('${day}','lesson','${x.t.id}')"><span style="color:${pillarCol(x.p.id)};font-weight:700;font-size:10px">${x.t.id}</span> ${esc(x.t.t)}</button>`).join("")||`<div style="font-size:12px;color:#a7adb6">All written lessons are studied or scheduled 🎉</div>`}
    <div class="micro" style="margin:14px 0 6px">Or a specific topic</div>
    <div class="field" style="position:relative;margin-bottom:8px"><input type="text" id="schedta" placeholder="Search 949 topics…" autocomplete="off" oninput="APP.schedTaInput(this.value,'${day}')"><div class="tahits" id="schedtahits" style="display:none"></div></div>
    <div class="micro" style="margin:14px 0 6px">Or a custom block</div>
    <div style="display:flex;gap:8px"><input type="text" id="schedCust" placeholder="e.g. Read attention paper · mock interview" style="flex:1;border:1px solid var(--border);border-radius:8px;padding:8px 10px">
    <input type="number" id="schedMin" value="30" min="5" max="240" style="width:70px;border:1px solid var(--border);border-radius:8px;padding:8px" title="minutes">
    <button class="btn primary" onclick="APP.schedAddCustom('${day}')">Add</button></div>
    <div class="mactions"><button class="btn" onclick="APP.closeModal()">Close</button></div>`);
  },
  schedTaInput(v,day){
    const q=v.trim().toLowerCase(), box=$("#schedtahits");
    if(q.length<2){box.style.display="none";return;}
    const wr=writtenSet();
    const hits=Object.values(topicIndex()).filter(({topic})=>topic.t.toLowerCase().includes(q)||topic.id.toLowerCase().includes(q)).slice(0,10);
    box.innerHTML=hits.map(({topic,pillar})=>`<button onclick="APP.schedAdd('${day}','lesson','${topic.id}')"><b style="color:#a7adb6;font-size:10.5px;margin-right:5px">${topic.id}</b>${esc(topic.t)}${(wr.has(topic.id)||topic.note)?"":" <span style='color:#c5c5cc;font-size:10px'>(not written yet — plan anyway)</span>"}</button>`).join("");
    box.style.display=hits.length?"block":"none";
  },
  schedAdd(day,type,ref){
    const s=schedGet();
    const ix=topicIndex()[ref];
    const it=item(ref);
    s.items.push({id:"s"+Date.now(),day,type:"lesson",ref,title:ix?ix.topic.t:ref,min:lessonMin(it),u:Date.now()});
    schedSave(s);closeModal();render();
  },
  schedAddCustom(day){
    const t=$("#schedCust").value.trim();if(!t)return toast("Give the block a name");
    const min=clamp(parseInt($("#schedMin").value||"30",10)||30,5,240);
    const s=schedGet();
    s.items.push({id:"s"+Date.now(),day,type:"custom",title:t,min,u:Date.now()});
    schedSave(s);closeModal();render();
  },
  /* review */
  reveal(){if(SESSION){SESSION.shown=true;render();}},
  pick(i){if(SESSION){SESSION.picked=i;SESSION.shown=true;render();}},
  checkTyped(){if(SESSION){const el=$("#typedIn");SESSION.typed=el?el.value:"";SESSION.shown=true;render();}},
  grade(g){
    if(!SESSION)return;
    const u=SESSION.q[SESSION.i];grade(resolveUnit(u),g);SESSION.doneCount++;
    SESSION.missed=(g===0)?resolveUnit(u):null;
    if(g===0)SESSION.q.push(u);
    SESSION.i++;SESSION.shown=false;SESSION.typed="";SESSION.picked=null;
    if(FOCUS&&SESSION.i>=SESSION.q.length){
      FOCUS.rec=(FOCUS.rec||0)+SESSION.doneCount;SESSION=null;showTick("✓");
      if(FOCUS.mode==="quick")VIEW={name:"focusquick",p:null};
      else if(FOCUS.lessons.length&&FOCUS.li<FOCUS.lessons.length){FOCUS.stage="lessons";VIEW={name:"lesson",p:FOCUS.lessons[FOCUS.li]};}
      else{FOCUS.stage="done";VIEW={name:"focusdone",p:null};}
      window.scrollTo(0,0);
    }
    render();renderSidebar();
  },
  endSession(){if(FOCUS)return APP.focusExit();SESSION=null;APP.go("home");},
  /* search */
  searchOpen(){SOPEN=true;$("#sov").classList.add("open");const q=$("#sq");q.value="";SHITS=[];SSEL=0;renderSearch();setTimeout(()=>q.focus(),30);},
  searchClose(){SOPEN=false;$("#sov").classList.remove("open");},
  sGo(i){const x=SHITS[i];if(x){APP.searchClose();x.go();}},
  gloss(id){const g=(DATA.glossary||[]).find(x=>x.id===id);if(g)openModal(vGloss(g));},
  closeModal,
  /* settings */
  settings(){
    openModal(`<h3>Vault connection</h3>
    <p style="font-size:12.5px;color:var(--muted);margin-bottom:14px">Same private repo as your phone. The token is stored only in this browser.</p>
    <div class="field"><label>Private repo (owner/name)</label><input type="text" id="srepo" placeholder="you/your-vault" value="${esc(repo())}"></div>
    <div class="field"><label>Fine-grained personal access token</label><input type="text" id="stok" placeholder="github_pat_… or ghp_…" value="${esc(token())}"></div>
    <div class="mactions">
      <button class="btn danger left" onclick="APP.eraseLocal()">Erase local cache</button>
      <button class="btn" onclick="APP.closeModal()">Cancel</button>
      <button class="btn primary" onclick="APP.saveSettings()">Connect</button></div>`);
  },
  async saveSettings(){
    const r=$("#srepo").value.trim(), t=$("#stok").value.trim();
    if(!r||!t)return toast("Repo and token are both needed");
    localStorage.setItem("meridian.repo",r);
    localStorage.setItem("meridian.token",t);
    toast("Checking connection…");
    try{
      await gh(`/repos/${r}/contents/app/app-data.json`,{method:"HEAD"});
      closeModal();toast("Connected ✓");setSync("ok");
      await fetchData();await pull();render();renderSidebar();
    }catch(e){
      try{ /* HEAD can 400 on large files via contents API — fall back to a real fetch */
        await fetchData();if(DATALOADED&&DATA.items.length){closeModal();toast("Connected ✓");await pull();render();renderSidebar();return;}
      }catch(e2){}
      toast("Couldn't load the repo — check token & name");
    }
  },
  eraseLocal(){
    if(confirm("Erase this browser's desktop cache? (Your vault repo and phone are untouched.)")){
      localStorage.removeItem("meridian.desk.db");location.reload();
    }
  }
};

/* ---------- render dispatch ---------- */
function render(){
  const m=$("#main");
  if(!token()){m.innerHTML=connectGate();return;}
  if(!DATALOADED&&!DATA.items.length){m.innerHTML=loadGate();return;}
  let h="";
  if(VIEW.name==="home")h=vHome();
  else if(VIEW.name==="pillar")h=vPillar(VIEW.p);
  else if(VIEW.name==="lesson"||VIEW.name==="item")h=vLesson(VIEW.p);
  else if(VIEW.name==="review")h=vReview();
  else if(VIEW.name==="capture")h=vCapture();
  else if(VIEW.name==="focusquick")h=vFocusQuick();
  else if(VIEW.name==="focusdone")h=vFocusDone();
  else h=vHome();
  document.querySelector(".app").classList.toggle("focusmode",!!FOCUS);
  m.innerHTML=(FOCUS?focusBar():"")+h;
  if(VIEW.name==="lesson"||VIEW.name==="item")buildTOC();
}

/* ---------- keyboard ---------- */
document.addEventListener("keydown",e=>{
  const inField=/^(INPUT|TEXTAREA|SELECT)$/.test((e.target&&e.target.tagName)||"");
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==="k"){e.preventDefault();SOPEN?APP.searchClose():APP.searchOpen();return;}
  if(SOPEN){
    if(e.key==="Escape"){APP.searchClose();}
    else if(e.key==="ArrowDown"){e.preventDefault();SSEL=Math.min(SHITS.length-1,SSEL+1);renderSearch();}
    else if(e.key==="ArrowUp"){e.preventDefault();SSEL=Math.max(0,SSEL-1);renderSearch();}
    else if(e.key==="Enter"){e.preventDefault();APP.sGo(SSEL);}
    return;
  }
  if($("#mov").classList.contains("open")){if(e.key==="Escape")closeModal();return;}
  if(e.key==="Escape"&&FOCUS){APP.focusExit();return;}
  if(VIEW.name==="review"&&SESSION&&SESSION.i<SESSION.q.length){
    const u=SESSION.q[SESSION.i];
    if(inField){
      if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();APP.checkTyped();}
      return;
    }
    if(!SESSION.shown){
      if(e.key===" "&&resolveUnit(u).type==="card"){e.preventDefault();APP.reveal();return;}
      const uu=resolveUnit(u);
      if(uu.type==="mcq"){
        const i=e.key.toUpperCase().charCodeAt(0)-65;
        if(i>=0&&i<(uu.a.choices||[]).length&&/^[a-zA-Z]$/.test(e.key)){e.preventDefault();APP.pick(i);return;}
      }
    }else{
      if(["1","2","3","4"].includes(e.key)){e.preventDefault();APP.grade(+e.key-1);return;}
    }
    return;
  }
  if(inField)return;
  if(VIEW.name==="lesson"){
    const nb=lessonNeighbors(VIEW.p);
    if(e.key==="ArrowLeft"&&nb.prev){APP.go("lesson",nb.prev);}
    if(e.key==="ArrowRight"&&nb.next){APP.go("lesson",nb.next);}
  }
});
$("#sq").addEventListener("input",e=>{SHITS=searchHits(e.target.value);SSEL=0;renderSearch();});
$("#sov").addEventListener("click",e=>{if(e.target.id==="sov")APP.searchClose();});
$("#mov").addEventListener("click",e=>{if(e.target.id==="mov")closeModal();});
/* global file drag → capture view */
document.addEventListener("dragover",e=>{e.preventDefault();});
document.addEventListener("drop",e=>{
  e.preventDefault();
  if(e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files.length){
    if(VIEW.name!=="capture")APP.go("capture");
    APP.capAddFiles(e.dataTransfer.files);
    toast(e.dataTransfer.files.length+" file(s) added to capture");
  }
});

/* ---------- test hook (used by the verification harness only) ---------- */
window.APP=APP;
window.__qld={
  get DATA(){return DATA;},set DATA(v){DATA=v;},
  get DB(){return DB;},set DB(v){DB=v;},
  get SESSION(){return SESSION;},set SESSION(v){SESSION=v;},
  get CAP(){return CAP;},set CAP(v){CAP=v;},
  get DATALOADED(){return DATALOADED;},set DATALOADED(v){DATALOADED=v;}
};

/* ---------- init ---------- */
renderSidebar();render();
if(token()){fetchData();pull().then(()=>{render();renderSidebar();});}
setInterval(()=>{if(token()&&document.visibilityState==="visible")fetchData();},5*60*1000);
/* active-minute ticker — same contract as mobile (minlog accrues 1/min while visible, feeds the
   40-min ring; cross-device same-day minutes merge as MAX, per both apps' mergeDB) */
setInterval(()=>{
  if(token()&&document.visibilityState==="visible"&&DATALOADED){logMin(1);saveLocal();
    const c=document.querySelector("#minchip");if(c)c.textContent="⏱ "+Math.round(activeMinToday())+"/40 min";}
},60*1000);
</script>
</body>
